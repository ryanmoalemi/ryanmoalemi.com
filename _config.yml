# GitHub Pages builds this repo with Jekyll 3, which replaces the default
# exclude list. Repeat those defaults, and keep markdown out of the site.
exclude:
  - "*.md"
  - "**/*.md"
  - README.md
  - AGENTS.md
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Stop Jekyll from turning markdown into public HTML pages such as /AGENTS.html.
optional_front_matter:
  enabled: false

# Publish static Next.js exports. Jekyll skips names that start with "_"
# (e.g. _next/, _buildManifest.js), so list them explicitly.
# (.nojekyll is not used because the site relies on the exclude list above.)
# stem-cell-repository/_next is the only underscore directory in that export.
# Nested _buildManifest.js, _ssgManifest.js, _not-found, _app-*.js, and
# _error-*.js are covered by the filename entries below.
include:
  - _next
  - stem-cell-repository/_next
  - _buildManifest.js
  - _ssgManifest.js
  - _not-found
  - "_app-*.js"
  - "_error-*.js"
