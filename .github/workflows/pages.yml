# GitHub Pages' branch Jekyll build has a 10-minute limit. The stem cell
# export is about 42,000 files, so this workflow builds Jekyll for the root
# site only, then copies the static exports into the published site.
# .nojekyll is not used: markdown stays unpublished via the Jekyll exclude list.
name: pages build and deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep static exports out of the Jekyll pass
        run: |
          python3 - << 'PY'
          from pathlib import Path
          path = Path("_config.yml")
          text = path.read_text()
          old = "exclude:\n"
          new = "exclude:\n  - stem-cell-repository/\n  - patient-demo/\n"
          if old not in text:
              raise SystemExit("exclude block missing from _config.yml")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build root site with Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Copy static exports
        run: |
          cp -a patient-demo stem-cell-repository _site/
          test ! -e _site/AGENTS.md
          test ! -e _site/README.md
          test ! -e _site/AGENTS.html
          test ! -e _site/README.html
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/sitemap.xml
          test -f _site/robots.txt
          test -f _site/patient-demo/index.html
          test -f _site/patient-demo/_next/static/chunks/webpack-b4719bfebe55b7b1.js
          test -f _site/stem-cell-repository/index.html
          test -f _site/stem-cell-repository/404.html
          test -f _site/stem-cell-repository/_next/static/css/55c48ba13f90579a.css
          test -f _site/stem-cell-repository/sitemap.xml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
